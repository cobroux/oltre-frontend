name: CI Angular

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build