<div class="date-field">
  <button
    type="button"
    class="date-trigger"
    [class.open]="open()"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    <svg class="cal-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>
    </svg>
    <span class="trigger-value" [class.placeholder]="!selected()">
      {{ selected() ? displayValue() : placeholder }}
    </span>
    @if (selected()) {
      <button type="button" class="clear-btn" (click)="clear($event)" aria-label="Effacer la date">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    }
  </button>

  @if (open()) {
    <div class="cal-popover">
      <div class="cal-header">
        <button type="button" class="cal-nav-btn" (click)="prevMonth($event)" aria-label="Mois précédent">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="cal-title">{{ monthLabel() }}</span>
        <button type="button" class="cal-nav-btn" (click)="nextMonth($event)" aria-label="Mois suivant">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div class="cal-weekdays">
        @for (w of weekdays; track $index) {
          <span>{{ w }}</span>
        }
      </div>

      <div class="cal-grid">
        @for (cell of days(); track cell.date.getTime()) {
          <button
            type="button"
            class="cal-day"
            [class.outside]="cell.outside"
            [class.today]="cell.today"
            [class.selected]="cell.selected"
            (click)="selectDay(cell, $event)"
          >{{ cell.day }}</button>
        }
      </div>

      <div class="cal-footer">
        <button type="button" class="cal-today-btn" (click)="goToday($event)">Aujourd&rsquo;hui</button>
      </div>
    </div>
  }
</div>
