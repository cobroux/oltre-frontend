server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker et ses manifestes doivent toujours être revalidés,
    # sinon une nouvelle version n'atteint jamais les téléphones.
    location ~ ^/(index\.html|ngsw-worker\.js|ngsw\.json|safety-worker\.js|assets/env\.js)$ {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
}
